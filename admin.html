<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>عیب‌یابی پنل ادمین</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #121318; color: #fff; font-family: Tahoma; padding: 20px; }
        .box { background: #1e2329; padding: 15px; margin-bottom: 15px; border-radius: 8px; }
        pre { color: #f0b90b; white-space: pre-wrap; }
    </style>
</head>
<body>

    <h2>🔍 عیب‌یابی اتصال به دیتابیس</h2>
    
    <div class="box">
        <h3>وضعیت جدول Users:</h3>
        <pre id="users-debug">در حال بررسی...</pre>
    </div>

    <div class="box">
        <h3>وضعیت جدول Transactions:</h3>
        <pre id="tx-debug">در حال بررسی...</pre>
    </div>

<script>
    const SUPABASE_URL = "https://zpwxvngrowhquwpovuf.supabase.co";
    const SUPABASE_KEY = "sb_publishable_JBx4FIY0wgu8D91RMYnMEQ_K7uDL5Hf"; 
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function checkData() {
        // تست جدول کاربران
        const usersRes = await db.from('users').select('*');
        const usersBox = document.getElementById('users-debug');
        if (usersRes.error) {
            usersBox.innerText = "خطا در جدول users:\n" + JSON.stringify(usersRes.error, null, 2);
        } else {
            usersBox.innerText = "تعداد کاربران ثبت‌شده: " + usersRes.data.length + "\n\n" + JSON.stringify(usersRes.data, null, 2);
        }

        // تست جدول تراکنش‌ها
        const txRes = await db.from('transactions').select('*');
        const txBox = document.getElementById('tx-debug');
        if (txRes.error) {
            txBox.innerText = "خطا در جدول transactions:\n" + JSON.stringify(txRes.error, null, 2);
        } else {
            txBox.innerText = "تعداد تراکنش‌ها: " + txRes.data.length + "\n\n" + JSON.stringify(txRes.data, null, 2);
        }
    }

    checkData();
</script>

</body>
</html>
