<!doctype html>
<html>
  <body style="margin:0;padding:0;background:#0b0e11;font-family:Arial,Helvetica,sans-serif;color:#f5f7fa;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#0b0e11;padding:28px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#11161d;border:1px solid #5f4a08;border-radius:18px;overflow:hidden;">
            <tr>
              <td style="padding:28px 28px 10px;text-align:center;">
                <div style="font-size:22px;font-weight:800;color:#f0b90b;">binancinvest</div>
                <div style="margin-top:8px;font-size:13px;color:#9ca6b3;">Account Security</div>
              </td>
            </tr>
            <tr>
              <td style="padding:18px 28px 6px;text-align:center;">
                <h1 style="margin:0;font-size:24px;line-height:1.35;color:#ffffff;">Password recovery code</h1>
                <p style="margin:12px 0 0;font-size:15px;line-height:1.7;color:#c8d0da;">
                  Enter the verification code below on the website to continue resetting your password.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:22px 28px;text-align:center;">
                <div style="display:inline-block;padding:18px 24px;border-radius:14px;background:#080b10;border:1px solid #f0b90b;color:#ffd84d;font-size:34px;font-weight:900;letter-spacing:8px;">
                  {{ .Token }}
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding:0 28px 28px;text-align:center;">
                <p style="margin:0;font-size:13px;line-height:1.7;color:#9099a5;">
                  This code is temporary. If you did not request a password reset, you can ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
