<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>بازیابی رمز | Binanc Invest</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at top,#20283a 0,#0c111b 48%,#070a10 100%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f7f8fb}.card{width:min(430px,100%);background:rgba(18,24,36,.96);border:1px solid #30394a;border-radius:24px;padding:28px;box-shadow:0 24px 70px #0009}.brand{color:#f5c84b;font-weight:800;font-size:14px;letter-spacing:.5px}.logo{width:50px;height:50px;border-radius:15px;background:linear-gradient(135deg,#ffe36b,#dca800);display:grid;place-items:center;color:#16191f;font-weight:900;margin-bottom:20px}h1{font-size:25px;margin:10px 0 8px}p{color:#aeb7c7;line-height:1.7;margin:0 0 20px;font-size:14px}label{display:block;margin:15px 0 8px;font-size:14px}input{width:100%;height:52px;border:1px solid #394356;border-radius:13px;background:#0c111b;color:white;padding:0 14px;font-size:16px;outline:none}input:focus{border-color:#e8bc39}button{width:100%;height:52px;border:0;border-radius:13px;background:linear-gradient(135deg,#ffe067,#eab500);color:#171a20;font-size:16px;font-weight:800;margin-top:18px}button:disabled{opacity:.55}.msg{display:none;margin-top:16px;padding:12px;border-radius:11px;font-size:14px;line-height:1.6}.ok{display:block;background:#123625;color:#8aefb7}.bad{display:block;background:#3c1d22;color:#ffadb5}.hide{display:none}.ltr{direction:ltr;text-align:left}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">BI</div><div class="brand">BINANC INVEST</div>
    <section id="requestBox">
      <h1>بازیابی رمز عبور</h1>
      <p>ایمیل حساب را وارد کنید. لینک امن تعیین رمز جدید برای شما ارسال می‌شود.</p>
      <label for="email">ایمیل</label>
      <input id="email" class="ltr" type="email" autocomplete="email" placeholder="support@binancinvest.com">
      <button id="sendBtn">ارسال لینک بازیابی</button>
    </section>
    <section id="changeBox" class="hide">
      <h1>رمز جدید</h1>
      <p>رمز جدید باید حداقل ۸ کاراکتر داشته باشد.</p>
      <label for="password">رمز جدید</label>
      <input id="password" class="ltr" type="password" autocomplete="new-password">
      <label for="confirm">تکرار رمز جدید</label>
      <input id="confirm" class="ltr" type="password" autocomplete="new-password">
      <button id="saveBtn">ذخیره رمز جدید</button>
    </section>
    <div id="message" class="msg"></div>
  </main>
<script>
const sb=supabase.createClient('https://zpwxvngrowhqquwpovuf.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpwd3h2bmdyb3docXF1d3BvdnVmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MjU3OTgsImV4cCI6MjEwMjMwMTc5OH0.Mri2kecKEUZTN3z_IqxR8_J8FYDeTj3SJtBfQcq_6X8');
const $=id=>document.getElementById(id), show=(text,ok=false)=>{$('message').textContent=text;$('message').className='msg '+(ok?'ok':'bad')};
function showChange(){ $('requestBox').classList.add('hide'); $('changeBox').classList.remove('hide'); }
sb.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')showChange()});
(async()=>{const {data}=await sb.auth.getSession();if(data.session&&(location.hash.includes('type=recovery')||location.search.includes('code=')))showChange()})();
$('sendBtn').onclick=async()=>{const email=$('email').value.trim();if(!email)return show('ایمیل را وارد کنید.');$('sendBtn').disabled=true;const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/reset-password.html'});$('sendBtn').disabled=false;if(error)return show(error.message);show('لینک بازیابی ارسال شد. صندوق ورودی و Spam را بررسی کنید.',true)};
$('saveBtn').onclick=async()=>{const p=$('password').value,c=$('confirm').value;if(p.length<8)return show('رمز باید حداقل ۸ کاراکتر باشد.');if(p!==c)return show('تکرار رمز با رمز جدید یکسان نیست.');$('saveBtn').disabled=true;const {error}=await sb.auth.updateUser({password:p});$('saveBtn').disabled=false;if(error)return show(error.message);show('رمز با موفقیت تغییر کرد. اکنون می‌توانید وارد پنل ادمین شوید.',true);setTimeout(()=>location.href='/admin.html',1800)};
</script>
</body>
</html>
