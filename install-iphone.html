<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<title>Install binancinvest</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  background:#030507;
  color:#f4f7fb;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
  background:
    radial-gradient(circle at 50% -10%,rgba(240,185,11,.18),transparent 34%),
    linear-gradient(180deg,#030507,#05070b);
}

main{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:34px 16px;
}

.card{
  width:min(440px,100%);
  position:relative;
  padding:72px 22px 28px;
  border:1px solid rgba(240,185,11,.28);
  border-radius:28px;
  background:linear-gradient(180deg,rgba(17,22,29,.96),rgba(8,12,17,.98));
  box-shadow:0 28px 80px rgba(0,0,0,.58);
  text-align:center;
}

/* دکمه بستن */
.close-btn{
  position:absolute;
  top:15px;
  right:15px;
  z-index:10;
  width:42px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid rgba(255,255,255,.18);
  border-radius:50%;
  background:rgba(255,255,255,.055);
  color:#d8dee8;
  text-decoration:none;
  font-size:31px;
  font-weight:300;
  line-height:1;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:.18s ease;
}

.close-btn:hover,
.close-btn:focus{
  color:#fff;
  border-color:rgba(240,185,11,.65);
  background:rgba(240,185,11,.12);
  transform:scale(1.05);
  outline:none;
}

.close-btn:active{
  transform:scale(.94);
}

.icon{
  position:absolute;
  top:-52px;
  left:50%;
  transform:translateX(-50%);
  width:116px;
  height:116px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:linear-gradient(145deg,rgba(240,185,11,.22),rgba(255,255,255,.04));
  border:1px solid rgba(255,229,138,.32);
}

.icon img{
  width:88px;
  height:88px;
  border-radius:22px;
}

h1{
  margin:0 0 12px;
  font-size:30px;
}

.meta{
  color:#aab4c0;
  line-height:1.7;
}

.qr{
  width:210px;
  margin:20px auto;
  padding:12px;
  border-radius:18px;
  background:#fff;
}

.qr img{
  width:100%;
  display:block;
}

.btn{
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  min-height:54px;
  border-radius:999px;
  color:#171100;
  text-decoration:none;
  font-size:17px;
  font-weight:900;
  background:linear-gradient(135deg,#fff09a,#f0b90b 58%,#d99a00);
}

.note{
  margin-top:18px;
  padding:14px;
  border-radius:16px;
  border:1px solid rgba(255,255,255,.07);
  background:rgba(255,255,255,.025);
  color:#b4bdc9;
  text-align:left;
  line-height:1.8;
  font-size:13px;
}

.note b{
  color:#ffe58a;
}
</style>
</head>

<body>
<main>
  <section class="card">

    <a class="close-btn" href="/" aria-label="Cancel and return to homepage">×</a>

    <div class="icon">
      <img src="/binancinvest-iphone-icon-180.png" alt="">
    </div>

    <h1>binancinvest</h1>

    <div class="meta">
      iPhone Profile Install<br>
      Full-screen Home Screen access
    </div>

    <div class="qr">
      <img src="/binancinvest-install-qr.png" alt="QR">
    </div>

    <a class="btn" href="/binancinvest-v37.mobileconfig">
      Download Profile
    </a>

    <div class="note">
      <b>Installation:</b><br>
      1. Open this page in Safari.<br>
      2. Tap <b>Download Profile</b> → <b>Allow</b>.<br>
      3. Open <b>Settings</b> → <b>Profile Downloaded</b>.<br>
      4. Tap <b>Install</b>.
    </div>

  </section>
</main>
</body>
</html>
